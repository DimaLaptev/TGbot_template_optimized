[project]
name = "tgbot-template-clean"
version = "0.2.0"
description = "Clean Architecture template for Telegram bot with multiple interfaces"
authors = [{name = "NekitPnt", email = "panatikin@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["telegram", "bot", "clean-architecture", "fastapi", "sqlalchemy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core async
    "asyncio-mqtt>=0.16.0",
    
    # Telegram
    "aiogram>=3.13.0",
    
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    
    # CLI
    "typer[all]>=0.12.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    
    # Cache
    "redis[hiredis]>=5.1.0",
    
    # Scheduling
    "apscheduler>=3.10.4",
    
    # Configuration
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    
    # Logging
    "structlog>=24.4.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "ujson>=5.10.0",
    "msgpack>=1.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0", 
    "pytest-cov>=5.0.0",
    "testcontainers>=4.8.0",
    "factory-boy>=3.3.0",
    
    # Code quality
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    
    # Development
    "ipython>=8.27.0",
    "ipdb>=0.13.13",
]

[project.scripts]
tgbot-cli = "src.interfaces.cli.main:app"
tgbot-api = "src.interfaces.api.main:main"
tgbot-telegram = "src.interfaces.telegram.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle, pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "ASYNC",          # async best practices
    "S",              # bandit security
    "B",              # bugbear
    "C4",             # comprehensions
    "DTZ",            # datetime
    "ISC",            # implicit string concatenation
    "PIE",            # misc improvements
    "T20",            # print statements
    "PT",             # pytest style
    "Q",              # quotes
    "RET",            # return statements
    "SIM",            # simplify
    "TRY",            # exception handling
    "PERF",           # performance
]
ignore = [
    "TRY003",         # raise vanilla exception
    "S101",           # assert usage
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "FBT"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
